<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ScrapeX</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <header class="header">
            <h1>ScrapeX</h1>
            <div class="controls">
                <div class="count" id="image-count">0 items</div>
                <label class="select-all">
                    <input type="checkbox" id="select-all" aria-label="Select all items">
                    Select all
                </label>
            </div>
        </header>

        <div class="actions">
            <button id="scrape-images-btn" class="btn primary">Scan Images</button>
            <button id="scrape-icons-btn" class="btn primary">Scan Icons</button>

            <div class="convert-group images-only">
                <label for="format-select">Convert to:</label>
                <select id="format-select">
                    <option value="original">Keep original</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WEBP</option>
                </select>
            </div>

            <div class="filter-group images-only">
                <label for="type-filter">Type:</label>
                <select id="type-filter">
                    <option value="all">All</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WEBP</option>
                </select>
                <label for="min-width">Min Width:</label>
                <input type="number" id="min-width" placeholder="0" style="width:60px" />
                <label for="min-height">Min Height:</label>
                <input type="number" id="min-height" placeholder="0" style="width:60px" />
                <button id="apply-filter" class="small-btn">Apply Filter</button>
                <button id="sort-filename" class="small-btn">Sort Filename</button>
                <button id="export-json" class="small-btn">Export JSON</button>
            </div>

            <div class="action-buttons images-only">
                <button id="download-selected" class="btn">Download Selected</button>
                <button id="download-selected-convert" class="btn">Download Selected (Convert)</button>
                <button id="download-all" class="btn">Download All</button>
            </div>
        </div>

        <main id="image-container" class="grid" aria-live="polite"></main>

        <footer class="footer">
            <small id="status">Idle</small>
        </footer>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
