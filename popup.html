<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ScrapeX</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="brand">
                <h1>ScrapeX</h1>
                <p>Extract, preview, and download assets quickly.</p>
            </div>
            <div class="header-right">
                <div class="count" id="image-count">0 items</div>
                <label class="select-all">
                    <input type="checkbox" id="select-all" aria-label="Select all items">
                    Select all
                </label>
            </div>
        </header>

        <div class="scan-switch">
            <button id="scrape-images-btn" class="btn active">Images</button>
            <button id="scrape-icons-btn" class="btn">Icons</button>
        </div>

        <section class="actions images-only">
            <div class="format-row">
                <label for="format-select">Format</label>
                <select id="format-select">
                    <option value="original">Keep original</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WEBP</option>
                </select>
                <label for="filename-prefix">Prefix</label>
                <input id="filename-prefix" type="text" placeholder="optional" />
                <label class="toggle-inline">
                    <input id="folder-by-domain" type="checkbox" />
                    Folder by domain
                </label>
                <button id="export-json" class="small-btn">Export JSON</button>
            </div>

            <div class="filter-row">
                <label for="type-filter">Type</label>
                <select id="type-filter">
                    <option value="all">All</option>
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WEBP</option>
                    <option value="gif">GIF</option>
                </select>
                <label for="min-width">Min W</label>
                <input id="min-width" type="number" min="0" value="0" />
                <label for="min-height">Min H</label>
                <input id="min-height" type="number" min="0" value="0" />
                <label for="sort-select">Sort</label>
                <select id="sort-select">
                    <option value="default">Default</option>
                    <option value="name-asc">Filename A-Z</option>
                    <option value="name-desc">Filename Z-A</option>
                    <option value="width-desc">Width high-low</option>
                    <option value="height-desc">Height high-low</option>
                    <option value="type-asc">Type A-Z</option>
                </select>
                <button id="apply-filters" class="small-btn">Apply</button>
                <button id="reset-filters" class="small-btn">Reset</button>
            </div>

            <div class="toggle-row">
                <label class="toggle-inline">
                    <input id="dedupe-toggle" type="checkbox" checked />
                    Dedupe URLs
                </label>
                <label class="toggle-inline">
                    <input id="new-only-toggle" type="checkbox" />
                    New since last scan
                </label>
                <label class="toggle-inline">
                    <input id="favorites-only-toggle" type="checkbox" />
                    Favorites only
                </label>
            </div>

            <div class="action-buttons">
                <button id="download-selected" class="btn">Download Selected</button>
                <button id="download-all" class="btn">Download All</button>
                <button id="retry-failed" class="btn">Retry Failed</button>
                <button id="clear-favorites" class="btn">Clear Favorites</button>
            </div>
        </section>

        <section class="queue-panel images-only">
            <div class="queue-meta">
                <span id="queue-label">Queue: Idle</span>
                <span id="failed-count">Failed: 0</span>
            </div>
            <progress id="queue-progress" max="100" value="0"></progress>
        </section>

        <main id="image-container" class="grid" aria-live="polite"></main>

        <footer class="footer">
            <small id="status">Idle</small>
        </footer>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
